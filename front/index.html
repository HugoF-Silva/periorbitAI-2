<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Periorbital AI - Face Analysis</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: black;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Icon components
    const Camera = ({ className = "" }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    );
    
    const ArrowLeft = ({ className = "" }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    );
    
    const MoreVertical = ({ className = "" }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="12" cy="5" r="1"></circle>
        <circle cx="12" cy="19" r="1"></circle>
      </svg>
    );
    
    const Share2 = ({ className = "" }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    );
    
    const Trash2 = ({ className = "" }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const App = () => {
      const [currentView, setCurrentView] = useState('gallery');
      const [photos, setPhotos] = useState([]);
      const [isFaceDetected, setIsFaceDetected] = useState(false);
      const [isCapturing, setIsCapturing] = useState(false);
      const [expandedPhoto, setExpandedPhoto] = useState(null);
      const [showMenu, setShowMenu] = useState(false);
      const detectionInterval = useRef(null);

      // Simulate face detection
      useEffect(() => {
        if (currentView === 'camera') {
          detectionInterval.current = setInterval(() => {
            setIsFaceDetected(Math.random() > 0.3);
          }, 500);
        } else {
          if (detectionInterval.current) {
            clearInterval(detectionInterval.current);
          }
        }

        return () => {
          if (detectionInterval.current) {
            clearInterval(detectionInterval.current);
          }
        };
      }, [currentView]);

      const capturePhoto = async () => {
        setIsCapturing(true);
        
        setTimeout(() => {
          const newPhoto = {
            id: Date.now(),
            url: `https://via.placeholder.com/400x600/2a2a2a/ffffff?text=Face+${photos.length + 1}`,
            description: `Analysis ${photos.length + 1}: Healthy periorbital region detected. No signs of puffiness or dark circles. Skin elasticity appears normal. Hydration level: Good.`,
            timestamp: new Date().toISOString()
          };
          
          setPhotos([...photos, newPhoto]);
          setIsCapturing(false);
          setCurrentView('gallery');
        }, 100);
      };

      const deletePhoto = (photoId) => {
        setPhotos(photos.filter(p => p.id !== photoId));
        setExpandedPhoto(null);
        setShowMenu(false);
      };

      const sharePhoto = () => {
        alert('Share functionality would open native share sheet');
        setShowMenu(false);
      };

      // Gallery View
      if (currentView === 'gallery') {
        return (
          <div className="w-full h-screen bg-black text-white">
            {/* Status Bar */}
            <div className="flex justify-between items-center px-6 pt-3 pb-2 text-xs">
              <span>9:41</span>
              <div className="flex items-center gap-1">
                <div className="w-4 h-3 bg-white rounded-sm"></div>
                <div className="w-4 h-3 bg-white rounded-sm opacity-70"></div>
                <div className="w-4 h-3 bg-white rounded-sm opacity-40"></div>
              </div>
            </div>

            {/* Header */}
            <div className="px-6 py-4">
              <h1 className="text-2xl font-semibold">Periorbital Analysis</h1>
            </div>

            {/* Content */}
            <div className="flex-1 px-6 overflow-y-auto">
              {photos.length === 0 ? (
                <div className="h-full flex items-center justify-center -mt-20">
                  <p className="text-gray-500">No photos yet</p>
                </div>
              ) : (
                <div className="space-y-4 pb-24">
                  {photos.map((photo) => (
                    <div
                      key={photo.id}
                      className="bg-gray-900 rounded-2xl overflow-hidden"
                    >
                      <div
                        onClick={() => setExpandedPhoto(photo)}
                        className="cursor-pointer aspect-[4/3] overflow-hidden"
                      >
                        <img
                          src={photo.url}
                          alt="Face analysis"
                          className="w-full h-full object-cover"
                        />
                      </div>
                      <div className="p-4">
                        <p className="text-sm text-gray-300">{photo.description}</p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Camera Button */}
            <div className="absolute bottom-8 right-6">
              <button
                onClick={() => setCurrentView('camera')}
                className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95"
              >
                <Camera className="w-8 h-8 text-black" />
              </button>
            </div>

            {/* Expanded Photo View */}
            {expandedPhoto && (
              <div className="absolute inset-0 bg-black z-50">
                <div className="flex justify-between items-center px-6 pt-3 pb-2">
                  <button
                    onClick={() => {
                      setExpandedPhoto(null);
                      setShowMenu(false);
                    }}
                    className="p-2 -ml-2"
                  >
                    <ArrowLeft className="w-6 h-6" />
                  </button>
                  <button
                    onClick={() => setShowMenu(!showMenu)}
                    className="p-2 -mr-2 relative"
                  >
                    <MoreVertical className="w-6 h-6" />
                    
                    {showMenu && (
                      <div className="absolute right-0 top-12 bg-gray-800 rounded-lg shadow-lg overflow-hidden min-w-[150px]">
                        <button
                          onClick={sharePhoto}
                          className="flex items-center gap-3 px-4 py-3 hover:bg-gray-700 w-full text-left"
                        >
                          <Share2 className="w-5 h-5" />
                          <span>Share</span>
                        </button>
                        <button
                          onClick={() => deletePhoto(expandedPhoto.id)}
                          className="flex items-center gap-3 px-4 py-3 hover:bg-gray-700 w-full text-red-400 text-left border-t border-gray-700"
                        >
                          <Trash2 className="w-5 h-5" />
                          <span>Delete</span>
                        </button>
                      </div>
                    )}
                  </button>
                </div>
                
                <div className="flex flex-col h-full">
                  <div className="flex-1 flex items-center justify-center px-6">
                    <img
                      src={expandedPhoto.url}
                      alt="Face analysis"
                      className="max-w-full max-h-full object-contain"
                    />
                  </div>
                  <div className="px-6 pb-8">
                    <p className="text-sm text-gray-300">{expandedPhoto.description}</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Camera View
      return (
        <div className="w-full h-screen bg-black text-white relative">
          {/* Flash Effect */}
          {isCapturing && (
            <div className="absolute inset-0 bg-white z-50 pointer-events-none"></div>
          )}

          {/* Status Bar */}
          <div className="flex justify-between items-center px-6 pt-3 pb-2 text-xs relative z-10">
            <span>9:41</span>
            <div className="flex items-center gap-1">
              <div className="w-4 h-3 bg-white rounded-sm"></div>
              <div className="w-4 h-3 bg-white rounded-sm opacity-70"></div>
              <div className="w-4 h-3 bg-white rounded-sm opacity-40"></div>
            </div>
          </div>

          {/* Back Button */}
          <div className="absolute top-16 left-6 z-10">
            <button
              onClick={() => setCurrentView('gallery')}
              className="p-2 bg-black/50 rounded-full backdrop-blur-sm"
            >
              <ArrowLeft className="w-6 h-6" />
            </button>
          </div>

          {/* Camera View */}
          <div className="absolute inset-0">
            <div className="w-full h-full bg-gradient-to-b from-gray-900 to-gray-800">
              {/* Simulated camera feed animation */}
              <div className="absolute inset-0 opacity-10">
                <div className="h-full w-full bg-gradient-to-b from-transparent via-white to-transparent animate-pulse"></div>
              </div>
              
              {/* Face detection frame */}
              <div className="absolute inset-0 flex items-center justify-center">
                <div className={`w-64 h-80 border-2 ${isFaceDetected ? 'border-green-400' : 'border-red-400'} rounded-3xl transition-all duration-300`}>
                  <div className="absolute -top-8 left-1/2 transform -translate-x-1/2">
                    <p className="text-sm bg-black/50 px-3 py-1 rounded-full backdrop-blur-sm whitespace-nowrap">
                      {isFaceDetected ? 'Face detected' : 'Position face here'}
                    </p>
                  </div>
                  
                  {/* Corner markers */}
                  <div className={`absolute -top-1 -left-1 w-8 h-8 border-t-2 border-l-2 ${isFaceDetected ? 'border-green-400' : 'border-red-400'} rounded-tl-xl transition-colors duration-300`}></div>
                  <div className={`absolute -top-1 -right-1 w-8 h-8 border-t-2 border-r-2 ${isFaceDetected ? 'border-green-400' : 'border-red-400'} rounded-tr-xl transition-colors duration-300`}></div>
                  <div className={`absolute -bottom-1 -left-1 w-8 h-8 border-b-2 border-l-2 ${isFaceDetected ? 'border-green-400' : 'border-red-400'} rounded-bl-xl transition-colors duration-300`}></div>
                  <div className={`absolute -bottom-1 -right-1 w-8 h-8 border-b-2 border-r-2 ${isFaceDetected ? 'border-green-400' : 'border-red-400'} rounded-br-xl transition-colors duration-300`}></div>
                </div>
              </div>
            </div>
          </div>

          {/* Camera Button */}
          <div className="absolute bottom-12 left-0 right-0 flex justify-center">
            <button
              onClick={capturePhoto}
              disabled={!isFaceDetected || isCapturing}
              className={`w-20 h-20 rounded-full border-4 border-white flex items-center justify-center transition-all ${
                isFaceDetected && !isCapturing
                  ? 'bg-white scale-100 active:scale-95'
                  : 'bg-transparent scale-90 opacity-50'
              }`}
              style={{ cursor: isFaceDetected ? 'pointer' : 'not-allowed' }}
            >
              {isFaceDetected && !isCapturing && (
                <div className="w-16 h-16 bg-black rounded-full"></div>
              )}
            </button>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
